<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  ============================================================
  3270 Nerd Font Mono ships three widths (Regular, SemiCondensed,
  Condensed) that all register under the SAME family name,
  "3270 Nerd Font Mono" - only the Condensed/SemiCondensed files also
  get an extra, width-specific alias of their own. Any app that asks
  for the bare family name with no style/width hint (kitty.conf,
  gtk-3.0/gtk-4.0, qt6ct, and this rice's VS Code settings all do
  exactly that) is handed whichever of the three fontconfig happens to
  match first - confirmed via `fc-match "3270 Nerd Font Mono"` landing
  on the Condensed file, not Regular, which is what every one of those
  configs actually intends.

  Fix: strip the shared "3270 Nerd Font Mono" alias off the
  Condensed/SemiCondensed files, leaving each with only its own
  exclusive width-specific name. That makes the bare family name
  resolve unambiguously to Regular, for every app, everywhere.

  Matched by postscriptname (3270NFM-Cond / 3270NFM-SemCond) rather
  than file path - stable across nerd-fonts releases and independent
  of where the font actually gets installed (this rice fetches it via
  system-setup.sh into ~/.local/share/fonts, but Void's nerd-fonts-ttf
  package - not used here, it's a 7.4GB bundle of every font family -
  would put the same files under /usr/share/fonts/NerdFonts/ttf/
  instead; postscriptname matches either way).
  ============================================================
-->
<fontconfig>
    <match target="scan">
        <test name="postscriptname">
            <string>3270NFM-Cond</string>
        </test>
        <edit name="family" mode="assign">
            <string>3270 Nerd Font Mono Cond</string>
        </edit>
    </match>
    <match target="scan">
        <test name="postscriptname">
            <string>3270NFM-SemCond</string>
        </test>
        <edit name="family" mode="assign">
            <string>3270 Nerd Font Mono SemCond</string>
        </edit>
    </match>
</fontconfig>
