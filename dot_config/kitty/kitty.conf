# ============================================================
# Kitty - terminal emulator.
# Part of the "Avalon Amber" rice. Managed via chezmoi.
# ============================================================

font_family 3270 Nerd Font Mono
font_size 14

# 3270 Nerd Font Mono only patches a subset of icons; fall back to the
# full Symbols Nerd Font Mono set for the entire Nerd Font Private Use
# Area (icons live only in PUA codepoints, regardless of nerd-fonts version).
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
symbol_map U+F0000-U+FFFFD Symbols Nerd Font Mono
symbol_map U+100000-U+10FFFD Symbols Nerd Font Mono

copy_on_select yes

allow_remote_control yes

strip_trailing_spaces smart

background_opacity 0.87

cursor_shape block
cursor_blink_interval 0.5

shell_integration enabled no-cursor

window_padding_width 24

bold_font        auto
italic_font      auto
bold_italic_font auto

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

active_tab_background   #4a3823
active_tab_foreground   #f4e4c1
active_tab_font_style   bold
inactive_tab_background #17110a
inactive_tab_foreground #8a6d3f
inactive_tab_font_style normal

cursor                  #e8b969
cursor_text_color       background

url_color               #e8b969

visual_bell_color       #f4e4c1
bell_border_color       #f4e4c1

active_border_color     #c9973a
inactive_border_color   #4a3823

foreground              #c9973a
background              #0d0906
selection_foreground    #0d0906
selection_background    #c9973a

# Monochrome amber ramp: labels below are the conventional ANSI slot names
# (red/green/blue/...), not the actual rendered hue - every slot is a shade
# of amber/brown, distinguished only by brightness, by design.

# black
color0                  #17110a
color8                  #4a3823

# red
color1                  #7a4a1e
color9                  #b6752a

# green
color2                  #8f6a2e
color10                 #cf9a3f

# yellow
color3                  #a67f35
color11                 #dcae4a

# blue
color4                  #6e5527
color12                 #9c8148

# purple
color5                  #9c8248
color13                 #d1b060

# aqua
color6                  #b39355
color14                 #e2c274

# white
color7                  #c9973a
color15                 #f4e4c1
