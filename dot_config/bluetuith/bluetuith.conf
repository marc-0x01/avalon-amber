// ============================================================
// bluetuith - TUI bluetooth manager.
// Part of the "Avalon Amber" rice. Managed via chezmoi.
// ============================================================
{
  // Power on, make pairable, and start scanning automatically on launch,
  // so pairing a new device doesn't need o/P/s pressed by hand first.
  adapter-states: "powered:yes,pairable:yes,scan:yes"

  // Ask before quitting so a stray Q doesn't drop a pairing/transfer in progress.
  confirm-on-quit: true

  receive-dir: "/home/mguillen/Downloads"

  theme: {
    Text: "#c9973a"
    Border: "#4a3823"
    Background: "transparent"
    StatusInfo: "#e8b969"
    StatusError: "#f4e4c1"

    Adapter: "#c9973a"
    AdapterPowered: "#e8b969"
    AdapterNotPowered: "#4a3823"
    AdapterDiscoverable: "#e8b969"
    AdapterScanning: "#f4e4c1"
    AdapterPairable: "#c9973a"

    Device: "#c9973a"
    DeviceType: "#8a6d3f"
    DeviceAlias: "#c9973a"
    DeviceConnected: "#f4e4c1"
    DeviceDiscovered: "#e8b969"
    DeviceProperty: "#8a6d3f"
    DevicePropertyConnected: "#f4e4c1"
    DevicePropertyDiscovered: "#e8b969"

    Menu: "#c9973a"
    MenuBar: "transparent"
    MenuItem: "#c9973a"

    ProgressBar: "#c9973a"
    ProgressText: "#e8b969"
  }
}
