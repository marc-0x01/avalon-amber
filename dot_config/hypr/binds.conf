# ============================================================
# Hyprland - keybindings.
# Part of the "Avalon Amber" rice. Managed via chezmoi.
# ============================================================

# Main Modifier
$mainMod = SUPER

# Launching Apps and Actions
bind = $mainMod, Q, killactive, # kill the window on focus
bind = $mainMod, delete, exec, wlogout --protocol xdg -b 3 -m 20 # power menu (lock/logout/suspend/reboot/shutdown)
bind = $mainMod, W, togglefloating, # toggle the window on focus to float
bind = $mainMod, F, fullscreen, # toggle the window on focus to fullscreen
bind = $mainMod, T, exec, kitty # open terminal
bind = $mainMod, E, exec, kitty -e yazi # open file manager (yazi)
bind = $mainMod, B, exec, qutebrowser # open browser
bind = $mainMod, space, exec, wofi --show drun # launch desktop applications
bind = $mainMod, S, layoutmsg, togglesplit # dwindle
bind = $mainMod, X, exec, hyprlock # lock screen

# Volume
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volumecontrol.sh i
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volumecontrol.sh d
bindel = , XF86AudioMute, exec, ~/.config/hypr/scripts/volumecontrol.sh m

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh output
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh region

# Clipboard History
bind = $mainMod, V, exec, cliphist list | wofi --dmenu -p "Clipboard" | cliphist decode | wl-copy

# Move focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, §, workspace, e+1
bind = $mainMod SHIFT, §, workspace, e-1

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod SHIFT, j, movewindow, u
bind = $mainMod SHIFT, k, movewindow, d
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r

## Layout mode - SUPER+R, then hjkl to resize, Escape to exit
bind = $mainMod,r, submap, layout
submap = layout
binde = ,l,resizeactive,24 0
binde = ,h,resizeactive,-24 0
binde = ,j,resizeactive,0 -24
binde = ,k,resizeactive,0 24
bind = ,escape,submap,reset
submap = reset

