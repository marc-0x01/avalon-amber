# ============================================================
# Hyprland - autostart (exec-once).
# Part of the "Avalon Amber" rice. Managed via chezmoi.
# ============================================================

# Session D-Bus (Void's ly/runit don't start one, unlike systemd - waybar,
# dunst's dbus-activation, and the polkit agent all need this to work at all)
exec-once = dbus-daemon --session --address=unix:path=$XDG_RUNTIME_DIR/bus --fork

# SSH agent - unlock the signing key once per session (ssh-add) instead of
# re-entering its passphrase on every git commit.
exec-once = ssh-agent -D -a /run/user/1000/ssh-agent.socket

# For GTK theming
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = ~/.config/hypr/scripts/loadgtk.sh
exec-once = hyprctl setcursor Adwaita 24

# Full brightness by default (amber CRT look wants max backlight)
exec-once = brightnessctl set 100%

# Audio (nothing starts pipewire/wireplumber on Void without this - no systemd/dbus activation here)
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber

exec-once = waybar # bar and widgets
exec-once = dunst # notification daemon

# Clipboard history (cliphist) - watches wl-clipboard, SUPER+V to browse via wofi
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 # authentication dialogue for GUI apps
# wallpaper daemon: hyprpaper 0.8.4 segfaults inside its hyprtoolkit
# dependency on this Hyprland build (confirmed reproducibly, unrelated
# to config) so it's uninstalled; swaybg is the stable stand-in. Worth
# checking periodically whether an updated hyprpaper fixes the crash
# and switching back for its nicer IPC-based live wallpaper reloading.
exec-once = swaybg -i ~/Pictures/wallpaper/avalon-amber.png -m fill
