# ============================================================
# Hyprland - session environment variables.
# Part of the "Avalon Amber" rice. Managed via chezmoi.
# ============================================================

env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Matches the ssh-agent socket path started in startup.conf, so every
# terminal/app in the session can use the same unlocked agent for git signing.
env = SSH_AUTH_SOCK,/run/user/1000/ssh-agent.socket

# ly launches Hyprland without going through a login shell, so
# /etc/profile.d/flatpak.sh never runs - without this, wofi/drun can't
# see flatpak apps' exported .desktop files at all.
env = XDG_DATA_DIRS,/home/mguillen/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DBUS_REMOTE,1 # https://www.reddit.com/r/archlinux/comments/ozubo9/using_firefox_on_wayland_make_sure_you_have_moz/
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = GTK_THEME,Adwaita:dark

env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1.5
