# ============================================================
# Hyprland - visual theme (borders, shader, animations).
# Part of the "Avalon Amber" rice. Managed via chezmoi.
# ============================================================

decoration {
    rounding = 0

    shadow {
        enabled = false
    }
    dim_special = 0.0
    screen_shader = ~/.config/hypr/shaders/avalon-crt.frag

    blur {
        enabled = false
    }
}

debug {
    # Uncomment to visualize screen damage regions when debugging rendering issues.
    # damage_tracking = 0
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    layout = dwindle
    gaps_in = 8
    gaps_out = 16
    border_size = 1
    col.active_border = rgba(c9973aee)
    col.inactive_border = rgba(4a3823aa)
}

animations {
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    enabled = yes
    bezier = wind, 0.02, 0.9, 0.1, 1.03
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.2, -0.2, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 12, winIn, popin
    animation = windowsOut, 1, 12, winOut, popin
    animation = windowsMove, 1, 5, wind, slide
    # animation = border, 1, 1, liner
    # animation = borderangle, 1, 80, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 20, wind
}
