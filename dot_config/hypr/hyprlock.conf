# ============================================================
# Hyprlock - lock screen.
# Based on the shipped /usr/share/hypr/hyprlock.conf sample (hyprlock v0.9.5).
# Part of the "Avalon Amber" rice. Managed via chezmoi.
# ============================================================

$font = 3270 Nerd Font Propo

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path =
    color = 0xFF0D0906
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(c9973aee)
    check_color = rgba(e8b969ee)
    # Fixed: was border-dim (4a3823), the dimmest shade - now fg-highlight,
    # the brightest, matching the "urgent = brightest" convention used
    # elsewhere (waybar battery-critical, dunst, wlogout hover).
    fail_color = rgba(f4e4c1ee)

    font_color = rgb(201, 151, 58)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = 0xFFC9973A
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = 0xFF8A6D3F
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
